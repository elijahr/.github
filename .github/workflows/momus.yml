name: PR Review

on:
  workflow_call:
    inputs:
      model:
        description: LLM model id passed to pi-coding-agent via LLM_MODEL.
        required: false
        type: string
        default: deepseek/deepseek-v4-pro
      base_url:
        description: LLM base URL passed to pi-coding-agent via LLM_BASE_URL.
        required: false
        type: string
        default: https://openrouter.ai/api/v1
      pr_number:
        description: Pull request number to review (string).
        required: true
        type: string
      event_name:
        description: Triggering event name (pull_request | issue_comment | workflow_dispatch).
        required: true
        type: string
      trigger_command:
        description: >-
          Slash command that triggers a re-review when posted as a PR comment.
          Default `/ai-review`. Override per repo via the calling workflow.
        required: false
        type: string
        default: /ai-review
      trigger_mention:
        description: >-
          Optional @-mention that also triggers a re-review (e.g.
          `@axiomantic-momus[bot]`). Empty disables mention-based triggering.
        required: false
        type: string
        default: ""
    secrets:
      LLM_API_KEY:
        required: true
      MOMUS_APP_ID:
        description: >-
          Optional. GitHub App ID used to mint an installation token so the
          bot can post APPROVE reviews. If unset, the bot falls back to the
          default GITHUB_TOKEN and any APPROVE verdict is downgraded to COMMENT.
        required: false
      MOMUS_APP_PRIVATE_KEY:
        description: >-
          Optional. PEM-formatted private key for the GitHub App referenced by
          MOMUS_APP_ID. Required if MOMUS_APP_ID is set.
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    # Coarse gate: skip bot-authored events, and for issue_comment require the
    # comment is on a PR. Fine-grained trigger-phrase match happens in the
    # trigger_check step below (GHA expressions cannot regex).
    if: >-
      github.event.sender.type != 'Bot' && (
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null
        )
      )
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.trigger_check.outputs.proceed }}
    steps:
      - name: Trigger check
        id: trigger_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Comment body is untrusted user input. Pass via env (never inline)
          # to avoid shell injection in the run script.
          COMMENT_BODY: ${{ github.event.comment.body }}
          TRIGGER_COMMAND: ${{ inputs.trigger_command }}
          TRIGGER_MENTION: ${{ inputs.trigger_mention }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          # Trigger filter: pull_request and workflow_dispatch always proceed;
          # issue_comment requires the body to start with the configured slash
          # command OR contain the configured @-mention.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            matched=0
            # Slash-command match: body starts with $TRIGGER_COMMAND followed by
            # whitespace or end-of-line. ERE alternation safe because both
            # the command and the body are quoted via env.
            if printf '%s' "$COMMENT_BODY" \
              | grep -qE "^$(printf '%s' "$TRIGGER_COMMAND" \
                | sed -e 's/[][\\.*^$/+?(){}|]/\\&/g')([[:space:]]|$)"; then
              matched=1
            fi
            # Mention match: body contains $TRIGGER_MENTION delimited by
            # whitespace, punctuation, or string boundaries. Skip if mention
            # is empty (feature disabled).
            if [ "$matched" -eq 0 ] && [ -n "$TRIGGER_MENTION" ]; then
              if printf '%s' "$COMMENT_BODY" \
                | grep -qE "(^|[[:space:]])$(printf '%s' "$TRIGGER_MENTION" \
                  | sed -e 's/[][\\.*^$/+?(){}|]/\\&/g')([[:space:]]|[[:punct:]]|$)"; then
                matched=1
              fi
            fi
            if [ "$matched" -eq 0 ]; then
              echo "Comment did not match trigger command or mention; skipping."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Concurrency: skip ourselves if another run of THIS workflow for
          # the same PR is already in flight. Filter by workflow_id so other
          # workflows (build/test/etc.) on the same PR don't false-trip us.
          # Reviews are expensive; the in-flight one will produce a result
          # against the latest head when it finishes.
          WF_ID=$(gh api "/repos/${REPO}/actions/runs/${THIS_RUN_ID}" --jq .workflow_id 2>/dev/null || echo 0)
          IN_FLIGHT=$(gh api \
            "/repos/${REPO}/actions/workflows/${WF_ID}/runs?status=in_progress&per_page=100" \
            --jq '[.workflow_runs[] | select(.id != '"$THIS_RUN_ID"') | select(.pull_requests[]? .number == '"$PR_NUMBER"')] | length' \
            2>/dev/null || echo 0)
          if [ "${IN_FLIGHT:-0}" -gt 0 ]; then
            echo "Another review run is already in progress for PR #$PR_NUMBER; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Detect GitHub App config
        # The `secrets` context cannot be referenced in step `if:` directly.
        # Stage the values into env, then emit a boolean output the next
        # step can gate on.
        id: detect_app
        env:
          APP_ID: ${{ secrets.MOMUS_APP_ID }}
          APP_KEY: ${{ secrets.MOMUS_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint GitHub App token
        # When the App secrets are configured, mint an installation token so
        # the bot's reviews are attributed to the App (and APPROVE verdicts
        # are accepted). Otherwise this step is skipped and downstream steps
        # fall back to GITHUB_TOKEN.
        id: app_token
        if: steps.detect_app.outputs.has_app == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MOMUS_APP_ID }}
          private-key: ${{ secrets.MOMUS_APP_PRIVATE_KEY }}

      - name: Resolve PR head SHA (issue_comment)
        id: resolve_sha
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid)
          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve head SHA for PR #$PR_NUMBER"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head (pull_request)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout PR head (issue_comment)
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_sha.outputs.sha }}
          fetch-depth: 0

      - name: Checkout default branch (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run momus
        uses: axiomantic/momus@main
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ inputs.base_url }}
          LLM_MODEL: ${{ inputs.model }}
          # Forwarded so the review footer shows the configured trigger
          # rather than the default `/ai-review`.
          MOMUS_TRIGGER_COMMAND: ${{ inputs.trigger_command }}
          MOMUS_TRIGGER_MENTION: ${{ inputs.trigger_mention }}
          # Tells momus the GITHUB_TOKEN is a custom GitHub App installation
          # token (capable of APPROVE) rather than the default github-actions
          # token (which GitHub rejects from approving). Without this signal
          # momus conservatively downgrades APPROVE to COMMENT.
          MOMUS_USING_APP_TOKEN: ${{ steps.detect_app.outputs.has_app }}
          # Prefer the App-minted token (so APPROVE works) and fall back to
          # the default GITHUB_TOKEN when the App isn't configured.
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          pr_number: ${{ inputs.pr_number }}
          event: ${{ inputs.event_name }}
