name: PR Agent

on:
  workflow_call:
    inputs:
      model:
        description: Primary model (litellm-style id; openrouter/<slug> routes via litellm's OpenRouter provider using OPENROUTER_API_KEY env)
        required: false
        type: string
        default: openrouter/deepseek/deepseek-v4-pro
      fallback_models:
        description: JSON array of fallback model ids
        required: false
        type: string
        default: '["openrouter/deepseek/deepseek-v4-flash","openrouter/anthropic/claude-sonnet-latest"]'
      custom_model_max_tokens:
        description: Context window override for unrecognized models
        required: false
        type: string
        default: "200000"
      auto_review:
        required: false
        type: string
        default: "false"
      auto_describe:
        required: false
        type: string
        default: "true"
      auto_improve:
        required: false
        type: string
        default: "true"
    secrets:
      OPENROUTER_KEY:
        required: true

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repo for convention discovery
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        continue-on-error: true

      - name: Load repo review instructions
        id: instructions
        continue-on-error: true
        run: |
          EXTRA=""
          for f in docs/code-review-instructions.md docs/coding-standards.md AGENTS.md CLAUDE.md; do
            if [ -f "$f" ]; then
              EXTRA="${EXTRA}

=== From ${f} ===
$(cat "$f")"
            fi
          done
          {
            echo "extra<<INSTRUCTIONS_EOF"
            printf '%s\n' "$EXTRA"
            echo "INSTRUCTIONS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: PR Agent
        id: pr_agent
        uses: axiomantic/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # axiomantic/pr-agent is our fork that adds an OPENROUTER_KEY env ->
          # OPENROUTER.KEY Dynaconf setting translation in github_action_runner.py.
          # That activates the existing OpenRouter handler block in
          # litellm_ai_handler.py which sets litellm.api_key correctly so
          # chat_completion injects an Authorization header. Upstream
          # (the-pr-agent/pr-agent) only translates OPENAI_KEY and leaves the
          # OpenRouter path dead-code in the GitHub Action context.
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          config.model: ${{ inputs.model }}
          config.fallback_models: ${{ inputs.fallback_models }}
          config.custom_model_max_tokens: ${{ inputs.custom_model_max_tokens }}
          github_action_config.auto_review: ${{ inputs.auto_review }}
          github_action_config.auto_describe: ${{ inputs.auto_describe }}
          github_action_config.auto_improve: ${{ inputs.auto_improve }}
          # /improve depth-tuning knobs. Upstream defaults narrow the label
          # space and disable score filtering, which produces shallow output.
          # focus_only_on_problems=false re-enables the full label set
          # (security/possible bug/possible issue/performance/enhancement/
          # best practice/maintainability/typo) so the model performs a
          # thorough scan; suggestions_score_threshold=5 then filters out
          # the noise via the reflect-pass score (so we get scan + filter,
          # not narrow-scan + no-filter). decouple_hunks=true uses the
          # line-grounded prompt path directly and skips a redundant
          # diff-conversion LLM hop. dual_publishing_score_threshold=8
          # also publishes high-confidence suggestions as inline GitHub
          # `suggestion` blocks (single-click apply) alongside the table.
          pr_code_suggestions.focus_only_on_problems: "false"
          pr_code_suggestions.suggestions_score_threshold: "5"
          pr_code_suggestions.decouple_hunks: "true"
          pr_code_suggestions.num_code_suggestions_per_chunk: "6"
          pr_code_suggestions.max_number_of_calls: "5"
          pr_code_suggestions.dual_publishing_score_threshold: "8"
          # Per-repo conventions discovered by the previous step. Falls
          # through harmlessly when the repo has no convention files.
          pr_code_suggestions.extra_instructions: ${{ steps.instructions.outputs.extra }}

      - name: Verify review actually posted
        if: always() && steps.pr_agent.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number in event context; skipping verification."
            exit 0
          fi
          echo "Checking last github-actions[bot] comment on $REPO PR #$PR_NUMBER..."
          LATEST=$(gh api "/repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]")] | sort_by(.updated_at) | reverse | .[0]')
          BODY=$(echo "$LATEST" | jq -r '.body // ""')
          if [ -z "$BODY" ]; then
            echo "::warning::No github-actions[bot] comment found. PR Agent may have skipped this event."
            exit 0
          fi
          if echo "$BODY" | grep -qiE '^[[:space:]]*Preparing review\.\.\.[[:space:]]*$|^[[:space:]]*Preparing PR description\.\.\.[[:space:]]*$'; then
            echo "::error::PR Agent left a 'Preparing...' placeholder. The LLM call likely failed (check earlier log for AuthenticationError, RateLimitError, etc)."
            echo "Comment body was:"
            echo "$BODY"
            exit 1
          fi
          echo "PR Agent posted a real comment. OK."
