name: PR Agent

on:
  workflow_call:
    inputs:
      model:
        description: Primary model (litellm-style id; openai/<openrouter-slug> routes via OpenAI-compatible client at OPENAI.API_BASE)
        required: false
        type: string
        default: openai/deepseek/deepseek-v4-pro
      fallback_models:
        description: JSON array of fallback model ids
        required: false
        type: string
        default: '["openai/deepseek/deepseek-v4-flash","openai/anthropic/claude-sonnet-latest"]'
      custom_model_max_tokens:
        description: Context window override for unrecognized models
        required: false
        type: string
        default: "200000"
      auto_review:
        required: false
        type: string
        default: "true"
      auto_describe:
        required: false
        type: string
        default: "true"
      auto_improve:
        required: false
        type: string
        default: "false"
    secrets:
      OPENROUTER_KEY:
        required: true

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: PR Agent
        id: pr_agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OpenRouter as an OpenAI-compatible endpoint.
          #
          # The pr-agent action runner only translates OPENAI_KEY env into the
          # OPENAI.KEY Dynaconf setting; there is no translation path for
          # OPENROUTER.* env vars, so the handler's openrouter block (which
          # would set litellm.api_key) is dead code in this context.
          #
          # The handler's OPENAI.KEY block sets litellm.openai_key but NOT
          # litellm.api_key, and chat_completion only injects kwargs["api_key"]
          # when litellm.api_key is set. So we must give litellm the auth via
          # the canonical OPENAI_API_KEY env var, which it reads natively for
          # openai-compatible routing. OPENAI.API_BASE retargets the request
          # at OpenRouter; the openai/ litellm model prefix selects the
          # openai-compatible client.
          OPENAI_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENAI.API_BASE: https://openrouter.ai/api/v1
          config.model: ${{ inputs.model }}
          config.fallback_models: ${{ inputs.fallback_models }}
          config.custom_model_max_tokens: ${{ inputs.custom_model_max_tokens }}
          github_action_config.auto_review: ${{ inputs.auto_review }}
          github_action_config.auto_describe: ${{ inputs.auto_describe }}
          github_action_config.auto_improve: ${{ inputs.auto_improve }}

      - name: Verify review actually posted
        if: always() && steps.pr_agent.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number in event context; skipping verification."
            exit 0
          fi
          echo "Checking last github-actions[bot] comment on $REPO PR #$PR_NUMBER..."
          LATEST=$(gh api "/repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]")] | sort_by(.updated_at) | reverse | .[0]')
          BODY=$(echo "$LATEST" | jq -r '.body // ""')
          if [ -z "$BODY" ]; then
            echo "::warning::No github-actions[bot] comment found. PR Agent may have skipped this event."
            exit 0
          fi
          if echo "$BODY" | grep -qiE '^[[:space:]]*Preparing review\.\.\.[[:space:]]*$|^[[:space:]]*Preparing PR description\.\.\.[[:space:]]*$'; then
            echo "::error::PR Agent left a 'Preparing...' placeholder. The LLM call likely failed (check earlier log for AuthenticationError, RateLimitError, etc)."
            echo "Comment body was:"
            echo "$BODY"
            exit 1
          fi
          echo "PR Agent posted a real comment. OK."
